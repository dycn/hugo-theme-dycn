baseURL      = "https://example.org/"
locale       = "en"
title        = "dycn example"
theme        = "hugo-theme-dycn"

[params]
  name            = "DYCN"
  avatar          = "/img/avatar.png"
  backgroundImage = "/bg1080.jpg"
  githubURL       = "https://github.com/dycn"
  defaultTheme    = "dark"
  defaultLang     = "en"
  pageSize        = 5
  fontCDN         = "https://cdnjs.cloudflare.com/ajax/libs/comic-neue/2.2.1/comic-neue.min.css"
  fontFamily      = "'Comic Neue', sans-serif"

  # i18n translations live in the theme's data/i18n.toml.
  # Override by placing your own data/i18n.toml in the project root.

  # ── Navigation links ──
  [[params.links]]
    icon    = "bi-journal-text"
    nameKey = "blog"
    url     = "#"

  [[params.links]]
    icon    = "bi-file-person"
    nameKey = "about"
    url     = "#"

  [[params.links]]
    icon    = "bi-envelope"
    nameKey = "contact"
    url     = "#"

  [[params.links]]
    icon    = "bi-github"
    nameKey = "github"
    url     = "https://github.com/dycn"

  # ── Contact methods ──
  [[params.contacts]]
    icon  = "bi-wechat"
    label = "WeChat"
    value = "Mr_dycn"

  [[params.contacts]]
    icon  = "bi-envelope-fill"
    label = "Email"
    value = "aidencheung@foxmail.com"

  [[params.contacts]]
    icon  = "bi-twitter-x"
    label = "Twitter"
    value = "@MrDycn"

  [[params.contacts]]
    icon  = "bi-telegram"
    label = "Telegram"
    value = "@MrDycn"

  [[params.contacts]]
    icon  = "bi-youtube"
    label = "YouTube"
    value = "@MrDycn"

  [[params.contacts]]
    icon  = "bi-tiktok"
    label = "TikTok"
    value = "@MrDycn"

  [[params.contacts]]
    icon  = "bi-instagram"
    label = "Instagram"
    value = "@MrDycn"

  [[params.contacts]]
    icon  = "bi-tencent-qq"
    label = "QQ"
    value = "123456789"
