<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ with .Site.Params.name }}{{ . }} | {{ end }}{{ .Site.Title }}</title>
<link rel="stylesheet" href="{{ .Site.Params.fontCDN | default `https://cdnjs.cloudflare.com/ajax/libs/comic-neue/2.2.1/comic-neue.min.css` }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
    :root {
        --font-family: {{ .Site.Params.fontFamily | default "'Comic Neue', sans-serif" | safeCSS }};
    }
</style>
<link rel="stylesheet" href="{{ "css/base.css" | relURL }}">
{{ if .IsPage }}
<link rel="stylesheet" href="{{ "css/article.css" | relURL }}">
{{ else }}
<link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
{{ end }}
