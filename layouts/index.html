</head>

<body>

  {{- partial "hero.html" . }}
  {{- partial "blog-section.html" . }}

  <div id="dycn-config"
    data-config='{{ dict "defaultLang" (.Site.Params.defaultLang | default "en") "defaultTheme" (.Site.Params.defaultTheme | default "dark") "pageSize" (.Site.Params.pageSize | default 5) "i18n" hugo.Data.i18n "contacts" .Site.Params.contacts | jsonify | safeHTML }}'>
