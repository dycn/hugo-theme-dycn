<!DOCTYPE html>
<html lang="{{ .Site.Params.defaultLang | default "en" }}">

<head>
  {{ partial "head.html" . }}
</head>

<body>
  {{- partial "toggles.html" . }}

  <section class="hero not-found-hero" id="hero">
    <div class="hero__bg-wrapper" aria-hidden="true">
      <div class="hero__bg" id="heroBg" style="background-image: url('{{ .Site.Params.backgroundImage | relURL }}');"></div>
    </div>
    <canvas class="hero__mask" id="heroMask" aria-hidden="true"></canvas>

    <div class="hero__content">
      <div class="card-inner not-found">
        <h1 class="not-found__code">404</h1>
        <p class="not-found__text" data-i18n="notFound">Page Not Found</p>
        <p class="not-found__description">The page you're looking for doesn't exist or has been moved.</p>
        <div class="not-found__actions">
          <a href="{{ "" | relURL }}" class="not-found__home">
            <i class="bi bi-house"></i>
            <span data-i18n="backHome">Home</span>
          </a>
          <a href="javascript:history.back()" class="not-found__back">
            <i class="bi bi-arrow-left"></i>
            <span>Go Back</span>
          </a>
        </div>
      </div>
    </div>
  </section>

  <div id="dycn-config"
      data-config='{{ dict "defaultLang" (.Site.Params.defaultLang | default "en") "defaultTheme" (.Site.Params.defaultTheme | default "dark") "i18n" hugo.Data.i18n | jsonify | safeHTML }}'>
  </div>
  <script src="{{ "js/home.js" | relURL }}"></script>
</body>

</html>
